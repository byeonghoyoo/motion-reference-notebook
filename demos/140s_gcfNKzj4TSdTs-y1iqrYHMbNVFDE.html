<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>픽셀 파티클 글로우</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@500;700&family=Caveat:wght@700&family=VT323&family=Archivo+Black&family=Dela+Gothic+One&display=swap"><style>*{margin:0;padding:0;box-sizing:border-box}html,body{height:100%;background:#111;overflow:hidden}body{display:flex;align-items:center;justify-content:center}#s{position:relative;width:1080px;height:1350px;flex:none;overflow:hidden;font-family:Pretendard,sans-serif;transform-origin:50% 50%}.abs{position:absolute}#s{background:#07070C}</style></head><body><div id="s"><canvas class="abs" id="pc" width="1080" height="1350" style="left:0;top:0"></canvas><canvas id="src" width="1080" height="1350" style="display:none"></canvas></div><script>var TAU=Math.PI*2;function $(i){return document.getElementById(i)}function cl(v,a,b){return Math.max(a,Math.min(b,v))}function sg(t,a,b){return cl((t-a)/(b-a),0,1)}function eo(k){return 1-Math.pow(1-k,3)}function eio(k){return k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2}function ebk(k){var c1=1.9,c3=c1+1;return 1+c3*Math.pow(k-1,3)+c1*Math.pow(k-1,2)}function spring(x,f,d){return x<=0?0:1-Math.exp(-x*(d||7))*Math.cos(x*(f||16))}function rnd(s){var v=Math.sin(s*91.37+17.13)*43758.5453;return v-Math.floor(v)}function lerp(a,b,k){return a+(b-a)*k}function rr(x,y,w,h,r){r=Math.min(r,w/2,h/2);return 'M'+(x+r)+','+y+'H'+(x+w-r)+'A'+r+','+r+' 0 0 1 '+(x+w)+','+(y+r)+'V'+(y+h-r)+'A'+r+','+r+' 0 0 1 '+(x+w-r)+','+(y+h)+'H'+(x+r)+'A'+r+','+r+' 0 0 1 '+x+','+(y+h-r)+'V'+(y+r)+'A'+r+','+r+' 0 0 1 '+(x+r)+','+y+'Z'}function circ(cx,cy,r){return r<=0?'':'M'+(cx-r)+','+cy+'a'+r+','+r+' 0 1 0 '+(2*r)+',0a'+r+','+r+' 0 1 0 '+(-2*r)+',0Z'}var P=4;</script><script>var pc=$('pc'),px=pc.getContext('2d'),src=$('src'),sx=src.getContext('2d'),S=10,cells=null;function hash(x,y,s){var h=x*374761393+y*668265263+(s||0)*1274126177;h=(h^(h>>13))*1274126177;return((h^(h>>16))>>>0)/4294967296}
function build(){sx.font='400 300px Anton';sx.textAlign='center';sx.fillStyle='#fff';sx.fillText('PIXEL',540,620);sx.font='900 120px Pretendard';sx.fillStyle='#FF4F8B';sx.fillText('모여라',540,860);var a=sx.getImageData(0,0,1080,1350).data;cells=[];for(var y=0;y<1350;y+=S)for(var x=0;x<1080;x+=S){var i=((y+S/2)*1080+(x+S/2))*4;if(a[i+3]>60)cells.push([x,y,'rgb('+a[i]+','+a[i+1]+','+a[i+2]+')'])}}
function draw(t){if(!cells){build()}px.clearRect(0,0,1080,1350);px.shadowBlur=18;cells.forEach(function(c){var cx=c[0]/S|0,cy=c[1]/S|0,r=hash(cx,cy),k=(t-.3-r*.8)/.5,out=sg(t,3.3,3.8);if(k<=0)return;var p=Math.min(1,k),ang=hash(cx,cy,7)*TAU,d=(1-p)*260+out*300;px.globalAlpha=p*(1-out);px.shadowColor=c[2];px.fillStyle=c[2];px.fillRect(c[0]+Math.cos(ang)*d,c[1]+Math.sin(ang)*d,S-1,S-1)});px.globalAlpha=1;px.shadowBlur=0}</script><script>(function(){var s=document.getElementById("s");function fit(){var k=Math.min(innerWidth/1080,innerHeight/1350);s.style.transform=k<1?"scale("+k+")":"none"}addEventListener("resize",fit);fit()})();window.__seek=function(t){window.__T=t;draw(t%P)};var __t0=performance.now();(function L(){if(window.__T===undefined)draw(((performance.now()-__t0)/1000)%P);requestAnimationFrame(L)})()</script></body></html>
