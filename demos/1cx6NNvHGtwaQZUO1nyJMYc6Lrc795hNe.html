<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>페이퍼 콜라주 스톱모션</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Nanum+Pen+Script&display=swap"><style>*{margin:0;padding:0;box-sizing:border-box}html,body{height:100%;background:#111;overflow:hidden}body{display:flex;align-items:center;justify-content:center}#s{position:relative;width:1080px;height:1350px;flex:none;overflow:hidden;font-family:Pretendard,sans-serif;transform-origin:50% 50%}#s{background:#E9DFCF url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence baseFrequency='.6' numOctaves='3'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .4  0 0 0 0 .3  0 0 0 .12 0'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>");color:#222}
.p{position:absolute;animation:jit .5s steps(1) infinite}
@keyframes jit{0%{transform:rotate(var(--r)) translate(0,0)}25%{transform:rotate(calc(var(--r) + 1deg)) translate(2px,-2px)}50%{transform:rotate(calc(var(--r) - .8deg)) translate(-2px,1px)}75%{transform:rotate(calc(var(--r) + .5deg)) translate(1px,2px)}}
.torn{clip-path:polygon(0 3%,6% 0,14% 4%,22% 1%,31% 3%,40% 0,52% 4%,61% 1%,70% 3%,82% 0,91% 4%,100% 1%,98% 12%,100% 25%,97% 38%,100% 52%,98% 66%,100% 80%,97% 92%,100% 100%,88% 97%,76% 100%,64% 96%,52% 100%,40% 97%,28% 100%,16% 96%,4% 100%,2% 88%,0 74%,3% 60%,0 46%,2% 32%,0 18%)}
.a{left:80px;top:170px;width:620px;height:300px;background:#F25C3C;--r:-4deg}
.b{left:300px;top:430px;width:720px;height:300px;background:#2F5DDB;--r:3deg}
.c{left:100px;top:740px;width:600px;height:250px;background:#FFFDF6;--r:-2deg;box-shadow:0 6px 0 rgba(0,0,0,.06)}
.tx{position:absolute;font-family:'Black Han Sans';line-height:1}
.a .tx{left:50px;top:70px;font-size:160px;color:#FFFDF6}
.b .tx{left:60px;top:80px;font-size:150px;white-space:nowrap;color:#FFE14D}
.c .tx{left:44px;top:40px;font:400 78px/1.2 'Nanum Pen Script';color:#222}
.tape{position:absolute;width:170px;height:54px;background:rgba(255,236,160,.8);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.st{position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;text-align:center;border:6px solid #fff;box-shadow:0 6px 14px rgba(0,0,0,.18);font:900 40px/1.1 Pretendard;animation:pop 1s cubic-bezier(.2,1.8,.3,1) both,jit .5s steps(1) 1s infinite}
@keyframes pop{from{transform:scale(0) rotate(-40deg)}to{transform:scale(1) rotate(var(--r))}}
.s1{right:70px;top:120px;width:220px;height:220px;background:#FFE14D;--r:12deg;animation-delay:.3s}
.s2{left:620px;top:900px;width:260px;height:260px;background:#F25C3C;color:#fff;--r:-10deg;animation-delay:.6s}
.doodle{position:absolute;font:400 60px 'Nanum Pen Script';color:#2F5DDB}</style></head><body><div id="s"><div class="p torn a"><div class="tx">오늘부터</div></div>
<div class="p torn b"><div class="tx">새로운 나</div></div>
<div class="p torn c"><div class="tx">작은 변화가 모여<br>큰 차이를 만들어요 :)</div></div>
<div class="tape" style="left:90px;top:150px;transform:rotate(-20deg)"></div><div class="tape" style="left:860px;top:410px;transform:rotate(25deg)"></div><div class="tape" style="left:560px;top:700px;transform:rotate(8deg)"></div>
<div class="st s1">NEW<br>✦</div><div class="st s2">첫 방문<br>혜택</div>
<div class="doodle" style="left:120px;top:1060px;transform:rotate(-6deg)">← 여기 주목!!</div>
<svg style="position:absolute;left:100px;top:1150px" width="500" height="120"><path d="M10 60 Q 120 10 230 60 T 470 60" fill="none" stroke="#F25C3C" stroke-width="8" stroke-linecap="round"/></svg></div><script>(function(){var s=document.getElementById("s");function fit(){var k=Math.min(innerWidth/1080,innerHeight/1350);s.style.transform=k<1?"scale("+k+")":"none"}addEventListener("resize",fit);fit()})();window.__seek=function(t){window.__T=t;document.getAnimations().forEach(function(a){a.pause();a.currentTime=t*1000});if(window.draw)draw(t)};if(window.draw){var __t0=performance.now();(function L(){if(window.__T===undefined)draw((performance.now()-__t0)/1000);requestAnimationFrame(L)})()}</script></body></html>
