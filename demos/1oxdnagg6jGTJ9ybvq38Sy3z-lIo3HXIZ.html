<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>에디토리얼 매거진</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700;900&display=swap"><style>*{margin:0;padding:0;box-sizing:border-box}html,body{height:100%;background:#111;overflow:hidden}body{display:flex;align-items:center;justify-content:center}#s{position:relative;width:1080px;height:1350px;flex:none;overflow:hidden;font-family:Pretendard,sans-serif;transform-origin:50% 50%}#s{background:#F3EDE3;color:#1d1a16}

.circle:after{content:"";position:absolute;inset:60px;border-radius:50%;border:2px solid rgba(255,255,255,.6)}
.big{position:absolute;left:80px;top:520px;font:700 150px/1.12 'Noto Serif KR',serif;letter-spacing:-6px}
.ln{display:block;overflow:hidden}.ln span{display:block;transform:translateY(105%);animation:up 1s cubic-bezier(.2,.8,.2,1) forwards}
.ln:nth-child(2) span{animation-delay:.15s}.ln:nth-child(3) span{animation-delay:.3s}
.it{font-style:italic;font-weight:400;color:#B8543F}
.sub{position:absolute;left:84px;top:1100px;font:400 30px/1.5 Pretendard;opacity:0;animation:fade .8s .9s forwards}
.foot{position:absolute;left:80px;right:80px;top:1240px;display:flex;justify-content:space-between;font:500 24px Pretendard;letter-spacing:3px;opacity:0;animation:fade .8s 1.1s forwards}
