<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>클레이모피즘 3D</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"><style>*{margin:0;padding:0;box-sizing:border-box}html,body{height:100%;background:#111;overflow:hidden}body{display:flex;align-items:center;justify-content:center}#s{position:relative;width:1080px;height:1350px;flex:none;overflow:hidden;font-family:Pretendard,sans-serif;transform-origin:50% 50%}#s{background:linear-gradient(170deg,#FFE9F1,#E9E4FF 60%,#DDF1FF);color:#3b2d52}
.o{position:absolute;animation:bob 3s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(var(--r,0deg))}50%{transform:translateY(-26px) rotate(calc(var(--r,0deg) + 6deg))}}
.ball{border-radius:50%;background:radial-gradient(circle at 32% 28%,#fff 0,var(--c1) 18%,var(--c2) 70%,var(--c3) 100%);box-shadow:inset -20px -30px 50px rgba(0,0,0,.12),0 40px 60px -20px rgba(80,50,120,.35)}
.pill{border-radius:120px;background:linear-gradient(160deg,#fff 0,#FFB6CF 20%,#FF7FA8 80%);box-shadow:inset -14px -18px 30px rgba(160,20,80,.25),inset 10px 10px 20px rgba(255,255,255,.7),0 40px 50px -20px rgba(180,40,90,.4)}
.ring{border-radius:50%;background:transparent;border:56px solid #8F7CFF;box-shadow:inset 8px 12px 18px rgba(255,255,255,.55),inset -10px -14px 20px rgba(40,20,120,.3),8px 12px 18px rgba(255,255,255,.2),0 40px 60px -20px rgba(70,50,170,.4)}
.card{position:absolute;left:90px;top:790px;width:900px;height:440px;border-radius:60px;background:rgba(255,255,255,.72);box-shadow:inset 6px 6px 16px rgba(255,255,255,.9),inset -10px -10px 24px rgba(120,100,180,.18),0 30px 60px -20px rgba(90,70,160,.35);padding:70px 70px}
.card h1{font:900 96px/1.15 Pretendard;letter-spacing:-4px}
.card p{font:500 34px Pretendard;margin-top:26px;color:#7a6a93}
.btn{position:absolute;right:70px;bottom:70px;padding:26px 44px;border-radius:40px;background:#8F7CFF;color:#fff;font:800 34px Pretendard;box-shadow:inset 4px 4px 10px rgba(255,255,255,.4),inset -6px -8px 14px rgba(40,20,120,.35),0 16px 30px -10px rgba(90,60,200,.6)}</style></head><body><div id="s"><div class="o ball" style="left:120px;top:170px;width:300px;height:300px;--c1:#FFE38A;--c2:#FFC23D;--c3:#F59E0B"></div>
<div class="o ring" style="left:540px;top:120px;width:360px;height:360px;--r:-20deg;animation-delay:-1s"></div>
<div class="o pill" style="left:420px;top:470px;width:360px;height:150px;--r:-25deg;animation-delay:-2s"></div>
<div class="o ball" style="left:830px;top:520px;width:150px;height:150px;--c1:#B8F3E0;--c2:#5FD9B5;--c3:#23A983;animation-delay:-.5s"></div>
<div class="o ball" style="left:90px;top:560px;width:110px;height:110px;--c1:#FFD1E1;--c2:#FF8FB8;--c3:#E4508A;animation-delay:-1.5s"></div>
<div class="card"><h1>말랑말랑,<br>기분 좋은 촉감</h1><p>손끝에 닿는 순간 느껴지는 차이</p><div class="btn">자세히 보기 →</div></div></div><script>(function(){var s=document.getElementById("s");function fit(){var k=Math.min(innerWidth/1080,innerHeight/1350);s.style.transform=k<1?"scale("+k+")":"none"}addEventListener("resize",fit);fit()})();window.__seek=function(t){window.__T=t;document.getAnimations().forEach(function(a){a.pause();a.currentTime=t*1000});if(window.draw)draw(t)};if(window.draw){var __t0=performance.now();(function L(){if(window.__T===undefined)draw((performance.now()-__t0)/1000);requestAnimationFrame(L)})()}</script></body></html>
