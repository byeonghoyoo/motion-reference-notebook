<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>아이소메트릭 3D</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"><style>*{margin:0;padding:0;box-sizing:border-box}html,body{height:100%;background:#111;overflow:hidden}body{display:flex;align-items:center;justify-content:center}#s{position:relative;width:1080px;height:1350px;flex:none;overflow:hidden;font-family:Pretendard,sans-serif;transform-origin:50% 50%}#s{background:#EAF2FF;color:#1b2340}

.cube{position:absolute;width:120px;height:120px;transform-style:preserve-3d}
.cube .top,.cube .fr,.cube .rt{position:absolute}
.cube .top{width:120px;height:120px;transform:translateZ(var(--h));background:var(--c);border-radius:6px}
.cube .fr{width:120px;height:var(--h);top:120px;transform-origin:0 0;transform:rotateX(-90deg) translateY(calc(var(--h) * -1));background:var(--d)}
.cube .rt{width:var(--h);height:120px;left:120px;transform-origin:0 0;transform:rotateY(90deg) translateX(calc(var(--h) * -1));background:var(--e)}
.cube{animation:rise 1.2s cubic-bezier(.2,1.4,.3,1) both}
@keyframes rise{from{--h:0px}}
@property --h{syntax:'<length>';inherits:true;initial-value:0px}
.lab{position:absolute;font:700 30px Pretendard;color:#1b2340;background:#fff;padding:10px 20px;border-radius:14px;box-shadow:0 8px 20px rgba(40,60,140,.15);opacity:0;animation:fi .5s forwards}@keyframes fi{to{opacity:1}}
.s{position:absolute;left:90px;bottom:100px;font:500 32px Pretendard;color:#5b6690}</style></head><body><div id="s"><div class="k">STEP BY STEP</div><div class="h">차곡차곡 쌓이는<br>피부 습관</div>

<div class="cube" style="left:-110px;top:-110px;--h:60px;--c:#B8C9FF;--d:#8FA5F3;--e:#7890E6;animation-delay:.7s"></div>

</div>

<div class="s">1주차부터 4주차까지, 매일 조금씩</div></div><script>(function(){var s=document.getElementById("s");function fit(){var k=Math.min(innerWidth/1080,innerHeight/1350);s.style.transform=k<1?"scale("+k+")":"none"}addEventListener("resize",fit);fit()})();window.__seek=function(t){window.__T=t;document.getAnimations().forEach(function(a){a.pause();a.currentTime=t*1000});if(window.draw)draw(t)};document.querySelectorAll(".cube").forEach(function(c){c.innerHTML='<div class="fr"></div><div class="rt"></div><div class="top"></div>'});if(window.draw){var __t0=performance.now();(function L(){if(window.__T===undefined)draw((performance.now()-__t0)/1000);requestAnimationFrame(L)})()}</script></body></html>
