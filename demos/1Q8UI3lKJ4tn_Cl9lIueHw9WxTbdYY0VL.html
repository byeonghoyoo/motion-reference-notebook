<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>채팅 버블 대화</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"><style>*{margin:0;padding:0;box-sizing:border-box}html,body{height:100%;background:#111;overflow:hidden}body{display:flex;align-items:center;justify-content:center}#s{position:relative;width:1080px;height:1350px;flex:none;overflow:hidden;font-family:Pretendard,sans-serif;transform-origin:50% 50%}#s{background:#B8CCE0;color:#111}
.top{position:absolute;left:0;right:0;top:0;height:150px;background:rgba(170,190,212,.9);display:flex;align-items:flex-end;padding:0 60px 30px;font:700 38px Pretendard}
.top i{font-style:normal;opacity:.5;margin-right:30px}
.m{position:absolute;max-width:680px;padding:28px 38px;border-radius:40px;font:500 44px/1.4 Pretendard;animation:pp .45s cubic-bezier(.2,1.6,.3,1) both}
@keyframes pp{from{transform:scale(.3);opacity:0}}
.l{left:170px;background:#fff;border-top-left-radius:10px;transform-origin:0 0}
.r{right:60px;background:#FEE500;border-top-right-radius:10px;transform-origin:100% 0}
.av{position:absolute;left:50px;width:96px;height:96px;border-radius:36px;background:linear-gradient(135deg,#FFB3C7,#FF6B9A);animation:pp .45s both}
.nm{position:absolute;left:170px;font:500 28px Pretendard;color:#4a5a6a;animation:pp .3s both}
.tm{position:absolute;font:400 22px Pretendard;color:#4a5a6a}
.typing{position:absolute;left:170px;top:1080px;background:#fff;border-radius:40px;border-top-left-radius:10px;padding:34px 40px;display:flex;gap:12px;animation:pp .4s 2.4s both}
.typing i{width:18px;height:18px;border-radius:50%;background:#9aa;animation:bl 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-10px);opacity:1}}
.big{position:absolute;left:0;right:0;bottom:60px;text-align:center;font:900 40px Pretendard;color:#1d3350;opacity:0;animation:pp .5s 2.8s forwards}</style></head><body><div id="s"><div class="top"><i>←</i>지수</div>
<div class="av" style="top:210px"></div><div class="nm" style="top:200px">지수</div>
<div class="m l" style="top:245px;animation-delay:.2s">야 너 요즘 피부 뭐 했어??</div>
<div class="m l" style="top:385px;animation-delay:.7s">완전 광나는데 😳</div>
<div class="m r" style="top:540px;animation-delay:1.2s">ㅋㅋㅋ 티 나?</div>
<div class="m r" style="top:680px;animation-delay:1.6s">비밀인데… 알려줄까? 🤫</div>
<div class="av" style="top:850px;animation-delay:2s"></div>
<div class="m l" style="top:880px;animation-delay:2.05s">당장 말해 제발 🙏</div>
<div class="typing"><i></i><i></i><i></i></div>
<div class="big">👉 다음 장에서 공개</div></div><script>(function(){var s=document.getElementById("s");function fit(){var k=Math.min(innerWidth/1080,innerHeight/1350);s.style.transform=k<1?"scale("+k+")":"none"}addEventListener("resize",fit);fit()})();window.__seek=function(t){window.__T=t;document.getAnimations().forEach(function(a){a.pause();a.currentTime=t*1000});if(window.draw)draw(t)};if(window.draw){var __t0=performance.now();(function L(){if(window.__T===undefined)draw((performance.now()-__t0)/1000);requestAnimationFrame(L)})()}</script></body></html>
