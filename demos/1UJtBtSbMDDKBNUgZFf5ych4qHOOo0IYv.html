<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>픽셀 계단 와이프</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@500;700&family=Caveat:wght@700&family=VT323&family=Archivo+Black&family=Dela+Gothic+One&display=swap"><style>*{margin:0;padding:0;box-sizing:border-box}html,body{height:100%;background:#111;overflow:hidden}body{display:flex;align-items:center;justify-content:center}#s{position:relative;width:1080px;height:1350px;flex:none;overflow:hidden;font-family:Pretendard,sans-serif;transform-origin:50% 50%}.abs{position:absolute}</style></head><body><div id="s"><div class="abs" id="A" style="inset:0;background:#2F5BEA;color:#fff"><div class="abs" style="left:90px;top:120px;font:700 28px Space Grotesk;letter-spacing:8px">SCENE A</div><div class="abs" style="left:84px;top:520px;font:900 150px/1.05 Pretendard;letter-spacing:-7px">고민은<br>여기까지</div></div><div class="abs" id="B" style="inset:0;background:#FFE45C;color:#111"><div class="abs" style="left:90px;top:120px;font:700 28px Space Grotesk;letter-spacing:8px">SCENE B</div><div class="abs" style="left:84px;top:520px;font:900 150px/1.05 Pretendard;letter-spacing:-7px">답은<br>다음 장</div></div></div><script>var TAU=Math.PI*2;function $(i){return document.getElementById(i)}function cl(v,a,b){return Math.max(a,Math.min(b,v))}function sg(t,a,b){return cl((t-a)/(b-a),0,1)}function eo(k){return 1-Math.pow(1-k,3)}function eio(k){return k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2}function ebk(k){var c1=1.9,c3=c1+1;return 1+c3*Math.pow(k-1,3)+c1*Math.pow(k-1,2)}function spring(x,f,d){return x<=0?0:1-Math.exp(-x*(d||7))*Math.cos(x*(f||16))}function rnd(s){var v=Math.sin(s*91.37+17.13)*43758.5453;return v-Math.floor(v)}function lerp(a,b,k){return a+(b-a)*k}function rr(x,y,w,h,r){r=Math.min(r,w/2,h/2);return 'M'+(x+r)+','+y+'H'+(x+w-r)+'A'+r+','+r+' 0 0 1 '+(x+w)+','+(y+r)+'V'+(y+h-r)+'A'+r+','+r+' 0 0 1 '+(x+w-r)+','+(y+h)+'H'+(x+r)+'A'+r+','+r+' 0 0 1 '+x+','+(y+h-r)+'V'+(y+r)+'A'+r+','+r+' 0 0 1 '+(x+r)+','+y+'Z'}function circ(cx,cy,r){return r<=0?'':'M'+(cx-r)+','+cy+'a'+r+','+r+' 0 1 0 '+(2*r)+',0a'+r+','+r+' 0 1 0 '+(-2*r)+',0Z'}var P=4;</script><script>function draw(t){var k=eio(sg(t,1,2.2)),e=k*(1350+1080+240),pts=['0px 0px','1080px 0px'];for(var i=8;i>=0;i--){var y=Math.round(cl(1350-e+i*120,0,1350)/120)*120;pts.push((i*120+120)+'px '+y+'px',(i*120)+'px '+y+'px')}$('A').style.clipPath='polygon('+pts.join(',')+')';$('B').style.zIndex=0;$('A').style.zIndex=1}</script><script>(function(){var s=document.getElementById("s");function fit(){var k=Math.min(innerWidth/1080,innerHeight/1350);s.style.transform=k<1?"scale("+k+")":"none"}addEventListener("resize",fit);fit()})();window.__seek=function(t){window.__T=t;draw(t%P)};var __t0=performance.now();(function L(){if(window.__T===undefined)draw(((performance.now()-__t0)/1000)%P);requestAnimationFrame(L)})()</script></body></html>
