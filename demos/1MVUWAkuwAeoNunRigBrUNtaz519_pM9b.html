<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>마스크 리빌 와이프</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"><style>*{margin:0;padding:0;box-sizing:border-box}html,body{height:100%;background:#111;overflow:hidden}body{display:flex;align-items:center;justify-content:center}#s{position:relative;width:1080px;height:1350px;flex:none;overflow:hidden;font-family:Pretendard,sans-serif;transform-origin:50% 50%}#s{background:#111;color:#fff}
.lay{position:absolute;inset:0;background:linear-gradient(160deg,#FF6B3D,#FF2E7E 60%,#7A2BFF);clip-path:circle(0% at 78% 30%);animation:ci 1.6s cubic-bezier(.7,0,.2,1) forwards}
@keyframes ci{to{clip-path:circle(150% at 78% 30%)}}
.o{position:absolute;left:560px;top:130px;width:420px;height:420px;border-radius:50%;border:3px solid #fff;transform:scale(0);animation:sc 1.2s cubic-bezier(.2,.9,.2,1) .5s forwards}@keyframes sc{to{transform:scale(1)}}
.ln{position:absolute;left:80px;font:900 150px/1 Pretendard;letter-spacing:-7px;overflow:hidden;padding:6px 0}
.ln .tx{opacity:0;animation:show 0s forwards}
.ln .wp{position:absolute;inset:0;background:#fff;transform:scaleX(0);transform-origin:0 50%;animation:wipe 1s cubic-bezier(.8,0,.2,1) forwards}
@keyframes wipe{0%{transform:scaleX(0);transform-origin:0 50%}50%{transform:scaleX(1);transform-origin:0 50%}50.01%{transform-origin:100% 50%}100%{transform:scaleX(0);transform-origin:100% 50%}}
@keyframes show{to{opacity:1}}
.l1{top:640px}.l2{top:800px}.l3{top:960px}
.l1 .wp{animation-delay:.6s}.l1 .tx{animation-delay:1.1s}
.l2 .wp{animation-delay:.8s;background:#111}.l2 .tx{animation-delay:1.3s}
.l3 .wp{animation-delay:1s}.l3 .tx{animation-delay:1.5s}
.k{position:absolute;left:84px;top:560px;font:600 28px Pretendard;letter-spacing:8px}
.s{position:absolute;left:84px;bottom:100px;font:500 32px Pretendard;opacity:.9}</style></head><body><div id="s"><div class="lay"></div><div class="o"></div><div class="k">REVEAL</div>
<div class="ln l1"><span class="tx">가려져 있던</span><span class="wp"></span></div>
<div class="ln l2" style="color:#111"><span class="tx">진짜 매력을</span><span class="wp"></span></div>
<div class="ln l3"><span class="tx">드러낼 때</span><span class="wp"></span></div>
<div class="s">지금, 당신의 차례</div></div><script>(function(){var s=document.getElementById("s");function fit(){var k=Math.min(innerWidth/1080,innerHeight/1350);s.style.transform=k<1?"scale("+k+")":"none"}addEventListener("resize",fit);fit()})();window.__seek=function(t){window.__T=t;document.getAnimations().forEach(function(a){a.pause();a.currentTime=t*1000});if(window.draw)draw(t)};if(window.draw){var __t0=performance.now();(function L(){if(window.__T===undefined)draw((performance.now()-__t0)/1000);requestAnimationFrame(L)})()}</script></body></html>
