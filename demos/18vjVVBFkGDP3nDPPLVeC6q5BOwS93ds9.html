<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>슬롯머신 타이포</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@500;700&family=Caveat:wght@700&family=VT323&family=Archivo+Black&family=Dela+Gothic+One&display=swap"><style>*{margin:0;padding:0;box-sizing:border-box}html,body{height:100%;background:#111;overflow:hidden}body{display:flex;align-items:center;justify-content:center}#s{position:relative;width:1080px;height:1350px;flex:none;overflow:hidden;font-family:Pretendard,sans-serif;transform-origin:50% 50%}.abs{position:absolute}#s{background:#111;color:#fff}.win{position:absolute;left:90px;width:900px;height:200px;top:560px;overflow:hidden;border-radius:30px;background:#FFE45C;color:#111}.col{position:absolute;left:0;right:0;text-align:center;font:400 160px/200px Anton}</style></head><body><div id="s">
<div class="abs" style="left:90px;top:380px;font:900 90px Pretendard;letter-spacing:-4px">오늘의 키워드</div><div class="win"><div class="col" id="col"></div></div></div><script>var TAU=Math.PI*2;function $(i){return document.getElementById(i)}function cl(v,a,b){return Math.max(a,Math.min(b,v))}function sg(t,a,b){return cl((t-a)/(b-a),0,1)}function eo(k){return 1-Math.pow(1-k,3)}function eio(k){return k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2}function ebk(k){var c1=1.9,c3=c1+1;return 1+c3*Math.pow(k-1,3)+c1*Math.pow(k-1,2)}function spring(x,f,d){return x<=0?0:1-Math.exp(-x*(d||7))*Math.cos(x*(f||16))}function rnd(s){var v=Math.sin(s*91.37+17.13)*43758.5453;return v-Math.floor(v)}function lerp(a,b,k){return a+(b-a)*k}function rr(x,y,w,h,r){r=Math.min(r,w/2,h/2);return 'M'+(x+r)+','+y+'H'+(x+w-r)+'A'+r+','+r+' 0 0 1 '+(x+w)+','+(y+r)+'V'+(y+h-r)+'A'+r+','+r+' 0 0 1 '+(x+w-r)+','+(y+h)+'H'+(x+r)+'A'+r+','+r+' 0 0 1 '+x+','+(y+h-r)+'V'+(y+r)+'A'+r+','+r+' 0 0 1 '+(x+r)+','+y+'Z'}function circ(cx,cy,r){return r<=0?'':'M'+(cx-r)+','+cy+'a'+r+','+r+' 0 1 0 '+(2*r)+',0a'+r+','+r+' 0 1 0 '+(-2*r)+',0Z'}var P=5;</script><script>var W=['탄력','밀도','쿨링','CLASSIC','HIGH','ALPHA','탄력','밀도','쿨링','ALPHA'];$('col').innerHTML=W.map(function(w){return '<div style="height:200px">'+w+'</div>'}).join('');
function draw(t){var stops=[[.3,0],[1.6,3],[2.9,5],[4.2,9]],pos=0;for(var i=0;i<stops.length-1;i++){if(t>=stops[i][0]){var k=sg(t,stops[i][0],stops[i][0]+.6);pos=lerp(stops[i][1],stops[i+1][1],ebk(k))}}var c=$('col');c.style.transform='translateY('+(-pos*200)+'px)';var v=Math.abs(pos-Math.round(pos));c.style.filter='blur(0) ';c.style.textShadow=v>.05?'0 -40px 0 rgba(0,0,0,.25),0 40px 0 rgba(0,0,0,.25)':'none'}</script><script>(function(){var s=document.getElementById("s");function fit(){var k=Math.min(innerWidth/1080,innerHeight/1350);s.style.transform=k<1?"scale("+k+")":"none"}addEventListener("resize",fit);fit()})();window.__seek=function(t){window.__T=t;draw(t%P)};var __t0=performance.now();(function L(){if(window.__T===undefined)draw(((performance.now()-__t0)/1000)%P);requestAnimationFrame(L)})()</script></body></html>
