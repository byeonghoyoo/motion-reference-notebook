<div class="abs" style="left:0;right:0;bottom:170px;text-align:center;font:700 56px Caveat;color:#FFE45C">on beat</div></div><script>var TAU=Math.PI*2;function $(i){return document.getElementById(i)}function cl(v,a,b){return Math.max(a,Math.min(b,v))}function sg(t,a,b){return cl((t-a)/(b-a),0,1)}function eo(k){return 1-Math.pow(1-k,3)}function eio(k){return k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2}function ebk(k){var c1=1.9,c3=c1+1;return 1+c3*Math.pow(k-1,3)+c1*Math.pow(k-1,2)}function spring(x,f,d){return x<=0?0:1-Math.exp(-x*(d||7))*Math.cos(x*(f||16))}function rnd(s){var v=Math.sin(s*91.37+17.13)*43758.5453;return v-Math.floor(v)}function lerp(a,b,k){return a+(b-a)*k}function rr(x,y,w,h,r){r=Math.min(r,w/2,h/2);return 'M'+(x+r)+','+y+'H'+(x+w-r)+'A'+r+','+r+' 0 0 1 '+(x+w)+','+(y+r)+'V'+(y+h-r)+'A'+r+','+r+' 0 0 1 '+(x+w-r)+','+(y+h)+'H'+(x+r)+'A'+r+','+r+' 0 0 1 '+x+','+(y+h-r)+'V'+(y+r)+'A'+r+','+r+' 0 0 1 '+(x+r)+','+y+'Z'}function circ(cx,cy,r){return r<=0?'':'M'+(cx-r)+','+cy+'a'+r+','+r+' 0 1 0 '+(2*r)+',0a'+r+','+r+' 0 1 0 '+(-2*r)+',0Z'}var P=3.7;</script><script>var BT=60/130,W=['고주파','몇 개?','쿨링은','어떻게?','통증','체감은?','3줄','요약 →'];function draw(t){var b=t/BT,i=Math.min(7,Math.floor(b)),k=b-i,e=$('w');e.textContent=W[i];e.style.transform='scale('+(1+.25*Math.exp(-k*6))+')';e.style.fontSize=(W[i].length>3?190:230)+'px';var g=(i%2)?Math.exp(-k*5):0;e.style.textShadow=g>.05?(16*g)+'px 0 #FF4F8B,'+(-16*g)+'px 0 #C6F432':'none'}</script><script>(function(){var s=document.getElementById("s");function fit(){var k=Math.min(innerWidth/1080,innerHeight/1350);s.style.transform=k<1?"scale("+k+")":"none"}addEventListener("resize",fit);fit()})();window.__seek=function(t){window.__T=t;draw(t%P)};var __t0=performance.now();(function L(){if(window.__T===undefined)draw(((performance.now()-__t0)/1000)%P);requestAnimationFrame(L)})()</script></body></html>
