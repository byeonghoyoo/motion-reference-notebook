<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>펀치인 / 펀치아웃</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@500;700&family=Caveat:wght@700&family=VT323&family=Archivo+Black&family=Dela+Gothic+One&display=swap"><style>*{margin:0;padding:0;box-sizing:border-box}html,body{height:100%;background:#111;overflow:hidden}body{display:flex;align-items:center;justify-content:center}#s{position:relative;width:1080px;height:1350px;flex:none;overflow:hidden;font-family:Pretendard,sans-serif;transform-origin:50% 50%}.abs{position:absolute}#s{background:#F2F0EB}#pz{position:absolute;inset:0;transform-origin:0 0}</style></head><body><div id="s"><div id="pz"><div class="abs" style="left:84px;top:200px;font:900 100px/1.1 Pretendard;letter-spacing:-5px">시술 시간은</div><div class="abs" style="left:84px;top:420px;font:400 420px/1 Anton;color:#2F5BEA">40</div><div class="abs" style="left:520px;top:700px;font:900 120px Pretendard">분</div><div class="abs" style="left:84px;top:1000px;font:600 40px Pretendard;color:#666">600샷 기준 안팎</div></div></div><script>var TAU=Math.PI*2;function $(i){return document.getElementById(i)}function cl(v,a,b){return Math.max(a,Math.min(b,v))}function sg(t,a,b){return cl((t-a)/(b-a),0,1)}function eo(k){return 1-Math.pow(1-k,3)}function eio(k){return k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2}function ebk(k){var c1=1.9,c3=c1+1;return 1+c3*Math.pow(k-1,3)+c1*Math.pow(k-1,2)}function spring(x,f,d){return x<=0?0:1-Math.exp(-x*(d||7))*Math.cos(x*(f||16))}function rnd(s){var v=Math.sin(s*91.37+17.13)*43758.5453;return v-Math.floor(v)}function lerp(a,b,k){return a+(b-a)*k}function rr(x,y,w,h,r){r=Math.min(r,w/2,h/2);return 'M'+(x+r)+','+y+'H'+(x+w-r)+'A'+r+','+r+' 0 0 1 '+(x+w)+','+(y+r)+'V'+(y+h-r)+'A'+r+','+r+' 0 0 1 '+(x+w-r)+','+(y+h)+'H'+(x+r)+'A'+r+','+r+' 0 0 1 '+x+','+(y+h-r)+'V'+(y+r)+'A'+r+','+r+' 0 0 1 '+(x+r)+','+y+'Z'}function circ(cx,cy,r){return r<=0?'':'M'+(cx-r)+','+cy+'a'+r+','+r+' 0 1 0 '+(2*r)+',0a'+r+','+r+' 0 1 0 '+(-2*r)+',0Z'}var P=3.8;</script><script>function draw(t){var cuts=[[0,1,540,675],[.9,2,300,640],[1.9,1.4,420,500],[2.9,1,540,675]],c=cuts[0];cuts.forEach(function(q){if(t>=q[0])c=q});var st=t-c[0],s=c[1]*(1+.03*Math.exp(-st*18));$('pz').style.transform='translate('+(540-c[2]*s)+'px,'+(675-c[3]*s)+'px) scale('+s+')'}</script><script>(function(){var s=document.getElementById("s");function fit(){var k=Math.min(innerWidth/1080,innerHeight/1350);s.style.transform=k<1?"scale("+k+")":"none"}addEventListener("resize",fit);fit()})();window.__seek=function(t){window.__T=t;draw(t%P)};var __t0=performance.now();(function L(){if(window.__T===undefined)draw(((performance.now()-__t0)/1000)%P);requestAnimationFrame(L)})()</script></body></html>
