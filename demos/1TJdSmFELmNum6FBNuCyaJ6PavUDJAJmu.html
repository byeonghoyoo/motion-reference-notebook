<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>폰 목업 UI 데모</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"><style>*{margin:0;padding:0;box-sizing:border-box}html,body{height:100%;background:#111;overflow:hidden}body{display:flex;align-items:center;justify-content:center}#s{position:relative;width:1080px;height:1350px;flex:none;overflow:hidden;font-family:Pretendard,sans-serif;transform-origin:50% 50%}#s{background:linear-gradient(160deg,#101828,#1d2b53);color:#fff}

.sheet{position:absolute;left:0;right:0;bottom:0;height:430px;background:#fff;border-radius:40px 40px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.18);padding:36px 30px;transform:translateY(100%);animation:sh 4s cubic-bezier(.2,.9,.2,1) infinite}
