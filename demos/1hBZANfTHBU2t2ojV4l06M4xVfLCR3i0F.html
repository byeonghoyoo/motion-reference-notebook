<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>라이트 스윕 (유광 반사)</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@500;700&family=Caveat:wght@700&family=VT323&family=Archivo+Black&family=Dela+Gothic+One&display=swap"><style>*{margin:0;padding:0;box-sizing:border-box}html,body{height:100%;background:#111;overflow:hidden}body{display:flex;align-items:center;justify-content:center}#s{position:relative;width:1080px;height:1350px;flex:none;overflow:hidden;font-family:Pretendard,sans-serif;transform-origin:50% 50%}.abs{position:absolute}#s{background:#1B1530}</style></head><body><div id="s">
<div class="abs" id="cd" style="left:120px;top:330px;width:840px;height:620px;border-radius:48px;background:linear-gradient(135deg,#C9A36B,#F5E3B5 45%,#B8894C);box-shadow:0 30px 80px rgba(0,0,0,.5);color:#2A1C08;padding:70px"><div style="font:700 28px Space Grotesk;letter-spacing:10px">PREMIUM</div><div style="font:900 110px/1.05 Pretendard;letter-spacing:-5px;margin-top:40px">정품<br>정량</div></div>
<div class="abs" id="sw" style="left:120px;top:330px;width:840px;height:620px;border-radius:48px;mix-blend-mode:screen;background:linear-gradient(105deg,rgba(255,255,255,0) 42%,rgba(255,255,255,.85) 50%,rgba(255,244,200,.35) 54%,rgba(255,255,255,0) 62%);background-size:300% 100%;background-repeat:no-repeat"></div></div><script>var TAU=Math.PI*2;function $(i){return document.getElementById(i)}function cl(v,a,b){return Math.max(a,Math.min(b,v))}function sg(t,a,b){return cl((t-a)/(b-a),0,1)}function eo(k){return 1-Math.pow(1-k,3)}function eio(k){return k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2}function ebk(k){var c1=1.9,c3=c1+1;return 1+c3*Math.pow(k-1,3)+c1*Math.pow(k-1,2)}function spring(x,f,d){return x<=0?0:1-Math.exp(-x*(d||7))*Math.cos(x*(f||16))}function rnd(s){var v=Math.sin(s*91.37+17.13)*43758.5453;return v-Math.floor(v)}function lerp(a,b,k){return a+(b-a)*k}function rr(x,y,w,h,r){r=Math.min(r,w/2,h/2);return 'M'+(x+r)+','+y+'H'+(x+w-r)+'A'+r+','+r+' 0 0 1 '+(x+w)+','+(y+r)+'V'+(y+h-r)+'A'+r+','+r+' 0 0 1 '+(x+w-r)+','+(y+h)+'H'+(x+r)+'A'+r+','+r+' 0 0 1 '+x+','+(y+h-r)+'V'+(y+r)+'A'+r+','+r+' 0 0 1 '+(x+r)+','+y+'Z'}function circ(cx,cy,r){return r<=0?'':'M'+(cx-r)+','+cy+'a'+r+','+r+' 0 1 0 '+(2*r)+',0a'+r+','+r+' 0 1 0 '+(-2*r)+',0Z'}var P=3.5;</script><script>function draw(t){var k=sg(t,.5,1.8);$('sw').style.backgroundPosition=(100-eio(k)*100)+'% 0';$('cd').style.transform='perspective(1600px) rotateY('+(Math.sin(t*1.8)*6)+'deg) rotateX('+(Math.cos(t*1.8)*4)+'deg)'}</script><script>(function(){var s=document.getElementById("s");function fit(){var k=Math.min(innerWidth/1080,innerHeight/1350);s.style.transform=k<1?"scale("+k+")":"none"}addEventListener("resize",fit);fit()})();window.__seek=function(t){window.__T=t;draw(t%P)};var __t0=performance.now();(function L(){if(window.__T===undefined)draw(((performance.now()-__t0)/1000)%P);requestAnimationFrame(L)})()</script></body></html>
