<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>파티클 글자 조립</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"><style>*{margin:0;padding:0;box-sizing:border-box}html,body{height:100%;background:#111;overflow:hidden}body{display:flex;align-items:center;justify-content:center}#s{position:relative;width:1080px;height:1350px;flex:none;overflow:hidden;font-family:Pretendard,sans-serif;transform-origin:50% 50%}#s{background:#0b0b0b}canvas{position:absolute;inset:0}
.cap{position:absolute;left:0;right:0;top:980px;text-align:center;color:#f5d27a;font:500 34px Pretendard;letter-spacing:12px}
.cap2{position:absolute;left:0;right:0;top:1050px;text-align:center;color:#fff;font:700 54px Pretendard;letter-spacing:-1px;opacity:.95}</style></head><body><div id="s"><canvas id="c" width="1080" height="1350"></canvas><div class="cap">GRAND OPENING</div><div class="cap2">흩어진 조각이 하나로</div></div><script>(function(){var s=document.getElementById("s");function fit(){var k=Math.min(innerWidth/1080,innerHeight/1350);s.style.transform=k<1?"scale("+k+")":"none"}addEventListener("resize",fit);fit()})();window.__seek=function(t){window.__T=t;document.getAnimations().forEach(function(a){a.pause();a.currentTime=t*1000});if(window.draw)draw(t)};var c=document.getElementById("c"),x=c.getContext("2d"),P=[];
function seed(i){var s=Math.sin(i*127.1)*43758.5453;return s-Math.floor(s)}
function build(){var o=document.createElement("canvas");o.width=1080;o.height=1350;var q=o.getContext("2d");q.fillStyle="#fff";q.font="900 330px Pretendard";q.textAlign="center";q.textBaseline="middle";q.fillText("D-7",540,640);
var d=q.getImageData(0,0,1080,1350).data;var n=0;for(var y=0;y<1350;y+=7)for(var X=0;X<1080;X+=7){if(d[(y*1080+X)*4+3]>128){P.push({tx:X,ty:y,sx:seed(n)*1080,sy:seed(n+.5)*1350,dl:seed(n+.7)*.8,sz:1.6+seed(n+.3)*2.4});n++}}}
document.fonts.ready.then(function(){build();if(window.__T!==undefined)draw(window.__T)});
function ease(k){return 1-Math.pow(1-k,4)}
window.draw=function(t){x.fillStyle="#0b0b0b";x.fillRect(0,0,1080,1350);var T=t%5;P.forEach(function(p,i){var k=Math.max(0,Math.min(1,(T-p.dl)/1.6));var e=ease(k);var sw=(1-e)*40*Math.sin(t*3+i);var px=p.sx+(p.tx-p.sx)*e+sw,py=p.sy+(p.ty-p.sy)*e;x.fillStyle=k>=1?"#F5D27A":"rgba(255,"+(180+70*e|0)+",120,"+(0.4+0.6*e)+")";x.beginPath();x.arc(px,py,p.sz*(k>=1?1:0.8),0,7);x.fill()})};if(window.draw){var __t0=performance.now();(function L(){if(window.__T===undefined)draw((performance.now()-__t0)/1000);requestAnimationFrame(L)})()}</script></body></html>
