<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>12fps 스톱모션 · 밑동 위글</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@500;700&family=Caveat:wght@700&family=VT323&family=Archivo+Black&family=Dela+Gothic+One&display=swap"><style>*{margin:0;padding:0;box-sizing:border-box}html,body{height:100%;background:#111;overflow:hidden}body{display:flex;align-items:center;justify-content:center}#s{position:relative;width:1080px;height:1350px;flex:none;overflow:hidden;font-family:Pretendard,sans-serif;transform-origin:50% 50%}.abs{position:absolute}#s{background:#F6F1E7}.st{position:absolute;padding:26px 40px;background:#fff;box-shadow:6px 8px 0 rgba(0,0,0,.15);font:800 54px Pretendard;transform-origin:50% 100%}</style></head><body><div id="s">

<div class="abs" id="mo" style="right:120px;top:360px;width:300px;height:300px;border-radius:50%;background:#2F5BEA;transform-origin:50% 100%;color:#fff;font:900 70px/300px Pretendard;text-align:center">NEW</div></div><script>var TAU=Math.PI*2;function $(i){return document.getElementById(i)}function cl(v,a,b){return Math.max(a,Math.min(b,v))}function sg(t,a,b){return cl((t-a)/(b-a),0,1)}function eo(k){return 1-Math.pow(1-k,3)}function eio(k){return k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2}function ebk(k){var c1=1.9,c3=c1+1;return 1+c3*Math.pow(k-1,3)+c1*Math.pow(k-1,2)}function spring(x,f,d){return x<=0?0:1-Math.exp(-x*(d||7))*Math.cos(x*(f||16))}function rnd(s){var v=Math.sin(s*91.37+17.13)*43758.5453;return v-Math.floor(v)}function lerp(a,b,k){return a+(b-a)*k}function rr(x,y,w,h,r){r=Math.min(r,w/2,h/2);return 'M'+(x+r)+','+y+'H'+(x+w-r)+'A'+r+','+r+' 0 0 1 '+(x+w)+','+(y+r)+'V'+(y+h-r)+'A'+r+','+r+' 0 0 1 '+(x+w-r)+','+(y+h)+'H'+(x+r)+'A'+r+','+r+' 0 0 1 '+x+','+(y+h-r)+'V'+(y+r)+'A'+r+','+r+' 0 0 1 '+(x+r)+','+y+'Z'}function circ(cx,cy,r){return r<=0?'':'M'+(cx-r)+','+cy+'a'+r+','+r+' 0 1 0 '+(2*r)+',0a'+r+','+r+' 0 1 0 '+(-2*r)+',0Z'}var P=5;</script><script>function draw(t0){var t=Math.floor(t0*12)/12;['s1','s2','s3'].forEach(function(id,i){var x=t-(.4+i*.5);var el=$(id);if(x<0){el.style.opacity=0;return}var n=Math.floor(x*12),Y=[-110,-24,8,0],R=[-8,5,-3,1,0];el.style.opacity=1;var idle=2*Math.sin(TAU*(t/1.6+i*.37));el.style.transform='translateY('+Y[Math.min(n,3)]+'px) rotate('+((n<5?R[n]:0)+idle)+'deg)'});$('mo').style.transform='rotate('+(6*Math.sin(TAU*t/1.2))+'deg)'}</script><script>(function(){var s=document.getElementById("s");function fit(){var k=Math.min(innerWidth/1080,innerHeight/1350);s.style.transform=k<1?"scale("+k+")":"none"}addEventListener("resize",fit);fit()})();window.__seek=function(t){window.__T=t;draw(t%P)};var __t0=performance.now();(function L(){if(window.__T===undefined)draw(((performance.now()-__t0)/1000)%P);requestAnimationFrame(L)})()</
