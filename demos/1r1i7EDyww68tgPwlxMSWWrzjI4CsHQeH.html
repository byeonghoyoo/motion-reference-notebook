<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>깨진 유리 리빌</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@500;700&family=Caveat:wght@700&family=VT323&family=Archivo+Black&family=Dela+Gothic+One&display=swap"><style>*{margin:0;padding:0;box-sizing:border-box}html,body{height:100%;background:#111;overflow:hidden}body{display:flex;align-items:center;justify-content:center}#s{position:relative;width:1080px;height:1350px;flex:none;overflow:hidden;font-family:Pretendard,sans-serif;transform-origin:50% 50%}.abs{position:absolute}#s{background:#111}</style></head><body><div id="s"><div class="abs" id="A" style="inset:0;background:#E8F4FF;color:#111"><div class="abs" style="left:90px;top:120px;font:700 28px Space Grotesk;letter-spacing:8px">SCENE A</div><div class="abs" style="left:84px;top:520px;font:900 150px/1.05 Pretendard;letter-spacing:-7px">피부는 겉만<br>보면 된다?</div></div><div class="abs" id="B" style="inset:0;background:#111;color:#FFE45C"><div class="abs" style="left:90px;top:120px;font:700 28px Space Grotesk;letter-spacing:8px">SCENE B</div><div class="abs" style="left:84px;top:520px;font:900 150px/1.05 Pretendard;letter-spacing:-7px">아니요,<br>속이 먼저</div></div><div id="sh" class="abs" style="inset:0;z-index:2"></div><svg class="abs" id="cr" width="1080" height="1350" style="left:0;top:0;z-index:3"></svg></div><script>var TAU=Math.PI*2;function $(i){return document.getElementById(i)}function cl(v,a,b){return Math.max(a,Math.min(b,v))}function sg(t,a,b){return cl((t-a)/(b-a),0,1)}function eo(k){return 1-Math.pow(1-k,3)}function eio(k){return k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2}function ebk(k){var c1=1.9,c3=c1+1;return 1+c3*Math.pow(k-1,3)+c1*Math.pow(k-1,2)}function spring(x,f,d){return x<=0?0:1-Math.exp(-x*(d||7))*Math.cos(x*(f||16))}function rnd(s){var v=Math.sin(s*91.37+17.13)*43758.5453;return v-Math.floor(v)}function lerp(a,b,k){return a+(b-a)*k}function rr(x,y,w,h,r){r=Math.min(r,w/2,h/2);return 'M'+(x+r)+','+y+'H'+(x+w-r)+'A'+r+','+r+' 0 0 1 '+(x+w)+','+(y+r)+'V'+(y+h-r)+'A'+r+','+r+' 0 0 1 '+(x+w-r)+','+(y+h)+'H'+(x+r)+'A'+r+','+r+' 0 0 1 '+x+','+(y+h-r)+'V'+(y+r)+'A'+r+','+r+' 0 0 1 '+(x+r)+','+y+'Z'}function circ(cx,cy,r){return r<=0?'':'M'+(cx-r)+','+cy+'a'+r+','+r+' 0 1 0 '+(2*r)+',0a'+r+','+r+' 0 1 0 '+(-2*r)+',0Z'}var P=4.5;</script><script>var PX=560,PY=640,N=12,RS=[0,160,360,620,1400],SH=[];(function(){var A=$('A');A.style.display='none';for(var i=0;i<N;i++)for(var j=0;j<RS.length-1;j++){var a0=(i+rnd(i)*.4)/N*TAU,a1=(i+1+rnd(i+1)*.4)/N*TAU,r0=RS[j]*(1+.15*rnd(i*7+j)),r1=RS[j+1]*(1+.15*rnd(i*3+j));var p=[[PX+Math.cos(a0)*r0,PY+Math.sin(a0)*r0],[PX+Math.cos(a1)*r0,PY+Math.sin(a1)*r0],[PX+Math.cos(a1)*r1,PY+Math.sin(a1)*r1],[PX+Math.cos(a0)*r1,PY+Math.sin(a0)*r1]];var d=A.cloneNode(true);d.removeAttribute('id');d.style.display='block';d.style.clipPath='polygon('+p.map(function(q){return q[0]+'px '+q[1]+'px'}).join(',')+')';$('sh').appendChild(d);SH.push({el:d,am:(a0+a1)/2,r:(r0+r1)/2,s:rnd(i*11+j)})}})();
function draw(t){var k=sg(t,1.2,2.6),crack=sg(t,.7,1.1),h='';SH.forEach(function(q){var e=eio(sg(k,q.r/1400*.3,1)),d=e*(260+q.s*300),fall=e*e*900;q.el.style.transform='translate('+(Math.cos(q.am)*d)+'px,'+(Math.sin(q.am)*d+fall)+'px) rotate('+((q.s-.5)*120*e)+'deg)';q.el.style.opacity=1-sg(k,.6,1)});
for(var i=0;i<N;i++){var a=i/N*TAU+rnd(i)*.3;h+='<line x1="'+PX+'" y1="'+PY+'" x2="'+(PX+Math.cos(a)*1400*crack)+'" y2="'+(PY+Math.sin(a)*1400*crack)+'" stroke="#fff" stroke-width="3" opacity="'+(crack>0&&k<.2?1:0)+'"/>'}$('cr').innerHTML=h}</script><script>(function(){var s=document.getElementById("s");function fit(){var k=Math.min(innerWidth/1080,innerHeight/1350);s.style.transform=k<1?"scale("+k+")":"none"}addEventListener("resize",fit);fit()})();window.__seek=function(t){window.__T=t;draw(t%P)};var __t0=performance.now();(function L(){if(window.__T===undefined)draw(((performance.now()-__t0)/1000)%P);requestAnimationFrame(L)})()</script></body></html>
