<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>네온 사인</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gugi&display=swap"><style>*{margin:0;padding:0;box-sizing:border-box}html,body{height:100%;background:#111;overflow:hidden}body{display:flex;align-items:center;justify-content:center}#s{position:relative;width:1080px;height:1350px;flex:none;overflow:hidden;font-family:Pretendard,sans-serif;transform-origin:50% 50%}#s{background:radial-gradient(circle at 50% 40%,#1a1030,#07040d 70%);color:#fff}
.wall{position:absolute;inset:0;opacity:.12;background-image:linear-gradient(#000 2px,transparent 2px),linear-gradient(90deg,#000 2px,transparent 2px);background-size:120px 60px,120px 60px;background-color:#2a1d3d}
.n{position:absolute;left:0;right:0;text-align:center;font-family:'Gugi',sans-serif}
.n1{top:360px;font-size:170px;color:#FFE7F7;text-shadow:0 0 6px #fff,0 0 18px #FF4FD8,0 0 40px #FF4FD8,0 0 80px #FF2EC4,0 0 140px #FF2EC4;animation:fl 3s steps(1) infinite}
.n2{top:600px;font-size:120px;color:#E7FDFF;text-shadow:0 0 6px #fff,0 0 18px #2EF2FF,0 0 40px #2EF2FF,0 0 80px #00C8FF,0 0 140px #00C8FF;animation:fl2 2.2s steps(1) infinite}
@keyframes fl{0%,100%{opacity:1}8%{opacity:.35}10%{opacity:1}12%{opacity:.5}14%{opacity:1}}
@keyframes fl2{0%,100%{opacity:1}40%{opacity:.4}42%{opacity:1}}
svg{position:absolute;left:0;top:0}

.sub{position:absolute;left:0;right:0;top:1120px;text-align:center;font:500 34px Pretendard;letter-spacing:6px;color:#cbb8ff}
.floor{position:absolute;left:0;right:0;bottom:0;height:260px;background:linear-gradient(transparent,rgba(255,79,216,.12))}</style></head><body><div id="s"><div class="wall"></div><svg width="1080" height="1350"><rect class="hs" x="130" y="250" width="820" height="620" rx="60"/><path class="hs" style="animation-delay:.4s" d="M540 990 C 500 950 440 960 440 1010 C 440 1060 540 1100 540 1100 C 540 1100 640 1060 640 1010 C 640 960 580 950 540 990 Z"/></svg>
