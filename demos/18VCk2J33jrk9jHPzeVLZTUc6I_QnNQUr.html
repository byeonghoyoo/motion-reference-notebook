<div class="abs" id="dots" style="left:0;right:0;top:1110px;text-align:center"></div></div><script>var TAU=Math.PI*2;function $(i){return document.getElementById(i)}function cl(v,a,b){return Math.max(a,Math.min(b,v))}function sg(t,a,b){return cl((t-a)/(b-a),0,1)}function eo(k){return 1-Math.pow(1-k,3)}function eio(k){return k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2}function ebk(k){var c1=1.9,c3=c1+1;return 1+c3*Math.pow(k-1,3)+c1*Math.pow(k-1,2)}function spring(x,f,d){return x<=0?0:1-Math.exp(-x*(d||7))*Math.cos(x*(f||16))}function rnd(s){var v=Math.sin(s*91.37+17.13)*43758.5453;return v-Math.floor(v)}function lerp(a,b,k){return a+(b-a)*k}function rr(x,y,w,h,r){r=Math.min(r,w/2,h/2);return 'M'+(x+r)+','+y+'H'+(x+w-r)+'A'+r+','+r+' 0 0 1 '+(x+w)+','+(y+r)+'V'+(y+h-r)+'A'+r+','+r+' 0 0 1 '+(x+w-r)+','+(y+h)+'H'+(x+r)+'A'+r+','+r+' 0 0 1 '+x+','+(y+h-r)+'V'+(y+r)+'A'+r+','+r+' 0 0 1 '+(x+r)+','+y+'Z'}function circ(cx,cy,r){return r<=0?'':'M'+(cx-r)+','+cy+'a'+r+','+r+' 0 1 0 '+(2*r)+',0a'+r+','+r+' 0 1 0 '+(-2*r)+',0Z'}var P=5;</script><script>function draw(t){var st=[[0,0],[1.2,1],[2.6,2],[4,0]],pos=0;for(var i=0;i<st.length-1;i++)if(t>=st[i][0]){var k=sg(t,st[i][0],st[i][0]+.7);pos=lerp(st[i][1],st[i+1][1],ebk(k))}var h='';for(var i=0;i<3;i++){var p=i-pos,e=$('c'+i);e.style.transform='translateX('+(p*560)+'px) scale('+(1-Math.min(1,Math.abs(p))*.18)+')';e.style.filter='brightness('+(1-Math.min(1,Math.abs(p))*.3)+')';e.style.zIndex=10-Math.round(Math.abs(p)*3);h+='<span style="display:inline-block;width:'+(Math.round(pos)==i?40:16)+'px;height:16px;border-radius:8px;margin:0 8px;background:'+(Math.round(pos)==i?'#111':'#bbb')+'"></span>'}$('dots').innerHTML=h}</script><script>(function(){var s=document.getElementById("s");function fit(){var k=Math.min(innerWidth/1080,innerHeight/1350);s.style.transform=k<1?"scale("+k+")":"none"}addEventListener("resize",fit);fit()})();window.__seek=function(t){window.__T=t;draw(t%P)};var __t0=performance.now();(function L(){if(window.__T===u
