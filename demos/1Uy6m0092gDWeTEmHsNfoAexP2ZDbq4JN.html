<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>퍼즐 피드 (그리드 3칸 연결)</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@500;700&family=Caveat:wght@700&family=VT323&family=Archivo+Black&family=Dela+Gothic+One&display=swap"><style>*{margin:0;padding:0;box-sizing:border-box}html,body{height:100%;background:#111;overflow:hidden}body{display:flex;align-items:center;justify-content:center}#s{position:relative;width:1080px;height:1350px;flex:none;overflow:hidden;font-family:Pretendard,sans-serif;transform-origin:50% 50%}.abs{position:absolute}#s{background:#fff}.pz{position:absolute;top:340px;width:356px;height:475px;overflow:hidden;background:#F0EEE9}.pz .in{position:absolute;top:0;width:1068px;height:475px}.lab{position:absolute;top:840px;width:356px;text-align:center;font:700 22px Space Grotesk;letter-spacing:4px;color:#999}</style></head><body><div id="s">
<div class="abs" style="left:84px;top:120px;font:900 84px/1.1 Pretendard;letter-spacing:-4px">한 줄이<br>한 장처럼</div>
<div id="z"></div><div class="lab" style="left:0">POST 3 → 1번째</div><div class="lab" style="left:362px">POST 2</div><div class="lab" style="left:724px">POST 1 (첫 업로드)</div>
<div class="abs" style="left:84px;top:960px;font:600 32px/1.6 Pretendard;color:#555">3240×1440 한 장을 디자인하고<br>1080×1440 세 칸으로 잘라 각 게시물의 첫 장으로.<br>업로드 순서는 3 → 2 → 1</div></div><script>var TAU=Math.PI*2;function $(i){return document.getElementById(i)}function cl(v,a,b){return Math.max(a,Math.min(b,v))}function sg(t,a,b){return cl((t-a)/(b-a),0,1)}function eo(k){return 1-Math.pow(1-k,3)}function eio(k){return k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2}function ebk(k){var c1=1.9,c3=c1+1;return 1+c3*Math.pow(k-1,3)+c1*Math.pow(k-1,2)}function spring(x,f,d){return x<=0?0:1-Math.exp(-x*(d||7))*Math.cos(x*(f||16))}function rnd(s){var v=Math.sin(s*91.37+17.13)*43758.5453;return v-Math.floor(v)}function lerp(a,b,k){return a+(b-a)*k}function rr(x,y,w,h,r){r=Math.min(r,w/2,h/2);return 'M'+(x+r)+','+y+'H'+(x+w-r)+'A'+r+','+r+' 0 0 1 '+(x+w)+','+(y+r)+'V'+(y+h-r)+'A'+r+','+r+' 0 0 1 '+(x+w-r)+','+(y+h)+'H'+(x+r)+'A'+r+','+r+' 0 0 1 '+x+','+(y+h-r)+'V'+(y+r)+'A'+r+','+r+' 0 0 1 '+(x+r)+','+y+'Z'}function circ(cx,cy,r){return r<=0?'':'M'+(cx-r)+','+cy+'a'+r+','+r+' 0 1 0 '+(2*r)+',0a'+r+','+r+' 0 1 0 '+(-2*r)+',0Z'}var P=5;</script><script>var SCN='<div class="in"><div class="abs" style="left:0;top:0;width:1068px;height:475px;background:linear-gradient(90deg,#FFD9C9,#E9E1FF 50%,#D6F5EE)"></div><svg class="abs" width="1068" height="475" style="left:0;top:0"><path id="WV" fill="none" stroke="#2F5BEA" stroke-width="6" stroke-linecap="round"/><circle id="RG" cx="534" cy="240" r="60" fill="none" stroke="#FF4F8B" stroke-width="5"/></svg><div class="abs" style="left:30px;top:60px;font:900 54px/1.05 Pretendard;letter-spacing:-2px">덴서티<br>vs 써마지</div><div class="abs" style="left:400px;top:60px;font:900 54px/1.05 Pretendard;letter-spacing:-2px">팁 3종</div><div class="abs" style="left:740px;top:60px;font:900 54px/1.05 Pretendard;letter-spacing:-2px">잘 맞는<br>피부</div><div class="abs" id="BD" style="left:-40px;top:400px;width:1150px;height:44px;background:#2F5BEA;transform:rotate(-2deg);color:#fff;font:400 28px/44px Anton;white-space:nowrap"></div></div>';
(function(){var h='';for(var i=0;i<3;i++)h+='<div class="pz" style="left:'+(i*362)+'px">'+SCN.replace('class="in"','class="in" style="left:'+(-i*356)+'px"')+'</div>';$('z').innerHTML=h})();
function draw(t){var d='';for(var x=0;x<=1068;x+=12)d+=(x?'L':'M')+x+','+(330+Math.sin(x/90+t*3)*26);[].forEach.call(document.querySelectorAll('#WV'),function(p){p.setAttribute('d',d)});[].forEach.call(document.querySelectorAll('#RG'),function(r){r.setAttribute('r',60+((t*140)%500))});[].forEach.call(document.querySelectorAll('#BD'),function(b){b.textContent=('DENSITY ✦ 덴서티 노트 ✦ ').repeat(6);b.style.transform='rotate(-2deg) translateX('+(-(t*60)%300)+'px)'})}</script><script>(function(){var s=document.getElementById("s");function fit(){var k=Math.min(innerWidth/1080,innerHeight/1350);s.style.transform=k<1?"scale("+k+")":"none"}addEventListener("resize",fit);fit()})();window.__seek=function(t){window.__T=t;draw(t%P)};var __t0=performance.now();(function L(){if(window.__T===undefined)draw(((performance.now()-__t0)/1000)%P);requestAnimationFrame(L)})()</script></body></html>
