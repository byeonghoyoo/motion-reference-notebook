<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>페이지 넘기기 (말린 모서리)</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@500;700&family=Caveat:wght@700&family=VT323&family=Archivo+Black&family=Dela+Gothic+One&display=swap"><style>*{margin:0;padding:0;box-sizing:border-box}html,body{height:100%;background:#111;overflow:hidden}body{display:flex;align-items:center;justify-content:center}#s{position:relative;width:1080px;height:1350px;flex:none;overflow:hidden;font-family:Pretendard,sans-serif;transform-origin:50% 50%}.abs{position:absolute}</style></head><body><div id="s"><div class="abs" id="A" style="inset:0;background:#FFF8EA;color:#111"><div class="abs" style="left:90px;top:120px;font:700 28px Space Grotesk;letter-spacing:8px">SCENE A</div><div class="abs" style="left:84px;top:520px;font:900 150px/1.05 Pretendard;letter-spacing:-7px">1장<br>문제</div></div><div class="abs" id="B" style="inset:0;background:#2F5BEA;color:#fff"><div class="abs" style="left:90px;top:120px;font:700 28px Space Grotesk;letter-spacing:8px">SCENE B</div><div class="abs" style="left:84px;top:520px;font:900 150px/1.05 Pretendard;letter-spacing:-7px">2장<br>해답</div></div><canvas class="abs" id="fl" width="1080" height="1350" style="left:0;top:0;z-index:5"></canvas></div><script>var TAU=Math.PI*2;function $(i){return document.getElementById(i)}function cl(v,a,b){return Math.max(a,Math.min(b,v))}function sg(t,a,b){return cl((t-a)/(b-a),0,1)}function eo(k){return 1-Math.pow(1-k,3)}function eio(k){return k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2}function ebk(k){var c1=1.9,c3=c1+1;return 1+c3*Math.pow(k-1,3)+c1*Math.pow(k-1,2)}function spring(x,f,d){return x<=0?0:1-Math.exp(-x*(d||7))*Math.cos(x*(f||16))}function rnd(s){var v=Math.sin(s*91.37+17.13)*43758.5453;return v-Math.floor(v)}function lerp(a,b,k){return a+(b-a)*k}function rr(x,y,w,h,r){r=Math.min(r,w/2,h/2);return 'M'+(x+r)+','+y+'H'+(x+w-r)+'A'+r+','+r+' 0 0 1 '+(x+w)+','+(y+r)+'V'+(y+h-r)+'A'+r+','+r+' 0 0 1 '+(x+w-r)+','+(y+h)+'H'+(x+r)+'A'+r+','+r+' 0 0 1 '+x+','+(y+h-r)+'V'+(y+r)+'A'+r+','+r+' 0 0 1 '+(x+r)+','+y+'Z'}function circ(cx,cy,r){return r<=0?'':'M'+(cx-r)+','+cy+'a'+r+','+r+' 0 1 0 '+(2*r)+',0a'+r+','+r+' 0 1 0 '+(-2*r)+',0Z'}var P=4.5;</script><script>var K=.7,fx=$('fl').getContext('2d');function hp(W,H,c){var P=[[0,0],[W,0],[W,H],[0,H]],o=[];function f(p){return p[0]+K*p[1]-c}for(var i=0;i<4;i++){var a=P[i],b=P[(i+1)%4],fa=f(a),fb=f(b);if(fa>=0)o.push(a);if(fa*fb<0){var r=fa/(fa-fb);o.push([a[0]+(b[0]-a[0])*r,a[1]+(b[1]-a[1])*r])}}return o.length?'polygon('+o.map(function(p){return p[0]+'px '+p[1]+'px'}).join(',')+')':'polygon(0 0,0 0,0 0)'}
function flap(W,H,c,a){fx.clearRect(0,0,W,H);if(a<=0)return;var pts=[];[[0,c/K],[W,(c-W)/K],[c,0],[c-K*H,H]].forEach(function(p){if(p[0]>=-1&&p[0]<=W+1&&p[1]>=-1&&p[1]<=H+1)pts.push(p)});if(pts.length<2)return;var n=1/Math.sqrt(1+K*K),w=110*a,ox=-n*w,oy=-K*n*w;fx.save();fx.shadowColor='rgba(0,0,0,.3)';fx.shadowBlur=30;var g=fx.createLinearGradient(pts[0][0],pts[0][1],pts[0][0]+ox,pts[0][1]+oy);g.addColorStop(0,'#E9E2D4');g.addColorStop(.6,'#FFFDF6');g.addColorStop(1,'#F2ECE0');fx.fillStyle=g;fx.beginPath();fx.moveTo(pts[0][0],pts[0][1]);fx.lineTo(pts[1][0],pts[1][1]);fx.lineTo(pts[1][0]+ox*.7,pts[1][1]+oy*.7);fx.lineTo(pts[0][0]+ox,pts[0][1]+oy);fx.fill();fx.restore()}
function draw(t){var k=sg(t,1,2.2),c=(1-eio(k))*(1080+K*1350+40)-20;$('A').style.zIndex=0;$('B').style.zIndex=1;$('B').style.clipPath=k>0?hp(1080,1350,c):'polygon(0 0,0 0,0 0)';flap(1080,1350,c,k>0&&k<1?Math.sin(Math.PI*k):0)}</script><script>(function(){var s=document.getElementById("s");function fit(){var k=Math.min(innerWidth/1080,innerHeight/1350);s.style.transform=k<1?"scale("+k+")":"none"}addEventListener("resize",fit);fit()})();window.__seek=function(t){window.__T=t;draw(t%P)};var __t0=performance.now();(function L(){if(window.__T===undefined)draw(((performance.now()-__t0)/1000)%P);requestAnimationFrame(L)})()</script></body></html>
