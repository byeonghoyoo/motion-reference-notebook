<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>연필 손그림 (선 떨림 boil)</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@500;700&family=Caveat:wght@700&family=VT323&family=Archivo+Black&family=Dela+Gothic+One&display=swap"><style>*{margin:0;padding:0;box-sizing:border-box}html,body{height:100%;background:#111;overflow:hidden}body{display:flex;align-items:center;justify-content:center}#s{position:relative;width:1080px;height:1350px;flex:none;overflow:hidden;font-family:Pretendard,sans-serif;transform-origin:50% 50%}.abs{position:absolute}#s{background:#FBF8F1}</style></head><body><div id="s">
<div class="abs" style="left:84px;top:470px;font:900 132px/1.1 Pretendard;letter-spacing:-6px">이거 하나만<br>기억해요</div><svg class="abs" id="pen" width="1080" height="1350" style="left:0;top:0"></svg></div><script>var TAU=Math.PI*2;function $(i){return document.getElementById(i)}function cl(v,a,b){return Math.max(a,Math.min(b,v))}function sg(t,a,b){return cl((t-a)/(b-a),0,1)}function eo(k){return 1-Math.pow(1-k,3)}function eio(k){return k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2}function ebk(k){var c1=1.9,c3=c1+1;return 1+c3*Math.pow(k-1,3)+c1*Math.pow(k-1,2)}function spring(x,f,d){return x<=0?0:1-Math.exp(-x*(d||7))*Math.cos(x*(f||16))}function rnd(s){var v=Math.sin(s*91.37+17.13)*43758.5453;return v-Math.floor(v)}function lerp(a,b,k){return a+(b-a)*k}function rr(x,y,w,h,r){r=Math.min(r,w/2,h/2);return 'M'+(x+r)+','+y+'H'+(x+w-r)+'A'+r+','+r+' 0 0 1 '+(x+w)+','+(y+r)+'V'+(y+h-r)+'A'+r+','+r+' 0 0 1 '+(x+w-r)+','+(y+h)+'H'+(x+r)+'A'+r+','+r+' 0 0 1 '+x+','+(y+h-r)+'V'+(y+r)+'A'+r+','+r+' 0 0 1 '+(x+r)+','+y+'Z'}function circ(cx,cy,r){return r<=0?'':'M'+(cx-r)+','+cy+'a'+r+','+r+' 0 1 0 '+(2*r)+',0a'+r+','+r+' 0 1 0 '+(-2*r)+',0Z'}var P=5;</script><script>function star(cx,cy,r){var s='';for(var i=0;i<=5;i++){var a=-Math.PI/2+i*4*Math.PI/5;s+=(i?'L':'M')+(cx+Math.cos(a)*r)+','+(cy+Math.sin(a)*r)}return s}function loop(cx,cy,rx,ry){var s='';for(var i=0;i<=40;i++){var a=i/40*TAU*1.07-.4;s+=(i?'L':'M')+(cx+Math.cos(a)*rx*(1+.06*Math.sin(i)))+','+(cy+Math.sin(a)*ry)}return s}
var DD=[{p:loop(430,730,380,90),c:'#FF4F8B',w:9,a:.4,d:1},{p:star(930,420,60),c:'#2F5BEA',w:9,a:1.3,d:.7},{p:'M90,900 C300,880 600,905 900,880',c:'#111',w:8,a:2,d:.8},{p:'M820,1000 C860,1080 760,1120 700,1060 M700,1060 L730,1030 M700,1060 L745,1075',c:'#2F5BEA',w:8,a:2.7,d:.8}];
function draw(t0){var t=Math.floor(t0*12)/12,bo=Math.floor(t*6),h='';DD.forEach(function(d,i){var k=sg(t,d.a,d.a+d.d),o=1-sg(t,4.3,4.7);if(k<=0)return;var jx=(rnd(bo+i*7)-.5)*3.5,jy=(rnd(bo+i*13)-.5)*3.5;h+='<path d="'+d.p+'" transform="translate('+jx+','+jy+')" fill="none" stroke="'+d.c+'" stroke-width="'+d.w+'" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="'+(1-k)+'" opacity="'+o+'"/>'});$('pen').innerHTML=h}</script><script>(function(){var s=document.getElementById("s");function fit(){var k=Math.min(innerWidth/1080,innerHeight/1350);s.style.transform=k<1?"scale("+k+")":"none"}addEventListener("resize",fit);fit()})();window.__seek=function(t){window.__T=t;draw(t%P)};var __t0=performance.now();(function L(){if(window.__T===undefined)draw(((performance.now()-__t0)/1000)%P);requestAnimationFrame(L)})()</script></body></html>
