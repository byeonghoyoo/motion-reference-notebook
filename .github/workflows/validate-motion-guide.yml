name: Validate motion study guide
on:
  push:
    paths:
      - '.github/workflows/validate-motion-guide.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-test:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: |
          npm install --no-save playwright@1.58.2
          npx playwright install chromium
      - name: Check live 24 demos and mobile layout
        run: |
          node <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
           const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
           const errors=[];
           const url='https://byeonghoyoo.github.io/motion-reference-notebook/study/vibe-coding/04-motion-effects/';
           for(const width of [1280,390]){
             const page=await browser.newPage({viewport:{width,height:850}});
             page.on('pageerror',e=>errors.push({width,msg:e.message}));
             const response=await page.goto(url,{waitUntil:'domcontentloaded',timeout:25000});
             await page.waitForTimeout(900);
             const count=await page.locator('.lesson').count();
             const stats=await page.evaluate(()=>({effects:typeof EFFECTS==='undefined'?-1:EFFECTS.length,grid:document.querySelectorAll('.lesson').length,frames:document.querySelectorAll('.lesson iframe').length,scrollW:document.body.scrollWidth,viewW:window.innerWidth,hasCode:document.querySelectorAll('.code-details').length}));
             console.log('PAGE_TEST',width,response.status(),JSON.stringify(stats));
             if(count!==24||stats.effects!==24||stats.scrollW>width+6)throw new Error('PAGE INVALID '+JSON.stringify(stats));
             await page.locator('[data-group="type"]').click();
             const typeCount=await page.locator('.lesson').count();
             console.log('CATEGORY_TEST',width,typeCount);
             if(typeCount!==8)throw new Error('Category filter failed');
             await page.locator('[data-group="screen"]').click();
             const screenCount=await page.locator('.lesson').count();
             console.log('SCREEN_TEST',width,screenCount);
             if(screenCount!==8)throw new Error('Screen filter failed');
             await page.close();
           }
           await browser.close();
           console.log('JAVASCRIPT_ERRORS',JSON.stringify(errors));
           if(errors.length)throw new Error('Page errors: '+JSON.stringify(errors));
          })().catch(e=>{console.error(e.stack);process.exit(1)});
          JS