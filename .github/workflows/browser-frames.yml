name: Capture real video frames via browser
on:
  push:
    paths: ['.github/workflows/browser-frames.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install chromium
      - name: Test frame access on native watch page and correctly referrered iframe
        run: |
          node <<'JS'
          const {chromium}=require('playwright'),fs=require('fs');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--no-sandbox','--autoplay-policy=no-user-gesture-required']});
            const contexts=[
              {name:'native-youtube',url:'https://www.youtube.com/watch?v=mlhKEy-2bgI&t=210s',nested:false},
              {name:'github-pages-iframe',url:'https://byeonghoyoo.github.io/motion-reference-notebook/study/vibe-coding/01-ui-terms/',nested:true}
            ];
            for(const cfg of contexts){
              const page=await browser.newPage({viewport:{width:1280,height:720},deviceScaleFactor:1});
              try{
                await page.goto(cfg.url,{waitUntil:'domcontentloaded',timeout:45000});
                await page.waitForTimeout(11000);
                const frame=cfg.nested? page.frames().find(f=>f.url().includes('youtube-nocookie.com/embed')):page.mainFrame();
                if(!frame){console.log(cfg.name,'iframe not loaded');continue;}
                let info=await frame.evaluate(()=>{const v=document.querySelector('video');return {video:!!v,width:v?.videoWidth||0,height:v?.videoHeight||0,readyState:v?.readyState||0,paused:v?.paused,currentTime:v?.currentTime||0,text:document.body?.innerText?.slice(0,600)}})
                console.log('TEST',cfg.name,JSON.stringify(info));
                if(info.video&&info.width<100){
                  try{await frame.evaluate(async()=>{const v=document.querySelector('video');try{await Promise.race([v.play(),new Promise((_,reject)=>setTimeout(()=>reject(Error("play timeout after 3s")),3000))])}catch(e){console.log(e.message)}});await page.waitForTimeout(6000)}catch(e){console.log('PLAY_FAIL',e.message)}
                  info=await frame.evaluate(()=>{const v=document.querySelector('video');return {width:v?.videoWidth||0,height:v?.videoHeight||0,readyState:v?.readyState||0,paused:v?.paused,currentTime:v?.currentTime||0,text:document.body?.innerText?.slice(0,600)}})
                  console.log('AFTER_PLAY',cfg.name,JSON.stringify(info));
                }
                if(info.width>=100&&info.height>=100){
                  const times=[91,118,141,164,186,213,230,268,286,310,342,372,389,408,431,452,479,494,517,536,552,567,596,615];
                  const dir='study/vibe-coding/01-ui-terms/frames';fs.mkdirSync(dir,{recursive:true});
                  let saved=0;
                  for(let i=0;i<times.length;i++){
                    const n=times[i],dest=dir+'/scene-'+String(i+1).padStart(2,'0')+'.jpg';
                    try{
                      await frame.evaluate(t=>{const v=document.querySelector('video');v.pause();v.currentTime=t;},n);
                      await frame.waitForFunction(t=>{const v=document.querySelector('video');return v&&v.readyState>=2&&Math.abs(v.currentTime-t)<1.6},n,{timeout:18000});
                      await frame.locator('video').screenshot({path:dest,type:'jpeg',quality:84,timeout:15000});
                      console.log('SAVED',n,fs.statSync(dest).size);
                      saved++;
                    }catch(e){console.log('SAVED_FAILED',n,String(e).slice(0,150));if(i===1&&saved===0)break;}
                  }
                  console.log('SAVED_TOTAL',saved,'method',cfg.name);
                  if(saved>0)break;
                }
              }catch(e){console.log('PAGE_ERROR',cfg.name,String(e).slice(0,220))}
              finally{await page.close();}
            }
            await browser.close();
          })().catch(e=>{console.error('FATAL',String(e));process.exit(1)});
          JS
      - name: Commit original real video frames, if captured
        run: |
          if test -f study/vibe-coding/01-ui-terms/frames/scene-01.jpg; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add study/vibe-coding/01-ui-terms/frames/
            git diff --cached --quiet || (git commit -m "Capture exact teaching-video still frames" && git push)
          fi
