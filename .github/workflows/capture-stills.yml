name: Capture source-video frames
on:
  push:
    paths: ['.github/workflows/capture-stills.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Test original preview-sheet sources
        run: |
          python - <<'PY'
          import urllib.request, re, json, os
          base='https://i.ytimg.com/sb/mlhKEy-2bgI/storyboard3'
          urls=[base+'_L0/default.jpg',base+'_L1/M0.jpg',base+'_L2/M0.jpg',base+'_L1/M0.jpg?sqp=-oaymwENSDfyq4qpAwVwAcABBqLzl_8DBgjBmdybBg%3D%3D', 'https://www.youtube.com/embed/mlhKEy-2bgI','https://www.youtube.com/watch?v=mlhKEy-2bgI','https://www.youtube-nocookie.com/embed/mlhKEy-2bgI']
          for i,url in enumerate(urls):
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36'})
              with urllib.request.urlopen(req, timeout=12) as res:
                data=res.read(3000000)
                print('source',i,'status',res.status,'type',res.headers.get('Content-Type'),'len',len(data))
                if data[:2]==b'\\xff\\xd8' or data[:4]==b'RIFF':
                  print('FOUND JPEG',i)
                  os.makedirs('/tmp/frames',exist_ok=True)
                  open('/tmp/frames/sheet%d.jpg'%i,'wb').write(data)
                else:
                  text=data.decode('utf-8',errors='ignore')
                  k=text.find('storyboard3')
                  print('storyboard3 pos:',k, 'around:',text[k-150:k+450] if k>=0 else text[:190])
                  for match in re.findall(r'https?[^" ]{0,250}storyboard[^" ]{0,350}',text)[:2]:print('SPEC:',match[:500])
            except Exception as e:print('source',i,'error',str(e))
          PY
      - name: Save verified preview sources
        run: |
          if ls /tmp/frames/sheet*.jpg >/dev/null 2>&1; then
            mkdir -p study/vibe-coding/01-ui-terms/frames
            cp /tmp/frames/*.jpg study/vibe-coding/01-ui-terms/frames/
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add study/vibe-coding/01-ui-terms/frames/
            git diff --cached --quiet || (git commit -m 'Store authentic YouTube storyboard source' && git push)
          fi
