name: Fetch authentic video storyboard frames
on:
  push:
    paths: ['.github/workflows/mirror-stills.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  frame-export:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: python -m pip install --upgrade pillow
      - name: Find video frame metadata from public video mirror services
        run: |
          python - <<'PY'
          import json,urllib.request,urllib.parse,io,math,os,sys
          from PIL import Image
          VID='mlhKEy-2bgI'
          BASE='study/vibe-coding/01-ui-terms/frames'
          TIMES=[91,118,141,164,186,213,230,268,286,310,342,372,389,408,431,452,479,494,517,536,552,567,596,615]
          HOSTS=['https://yt.chocolatemoo53.com','https://invidious.tiekoetter.com','https://invidious.f5.si','https://invidious.nerdvpn.de','https://inv.nadeko.net']
          headers={'User-Agent':'Mozilla/5.0','Accept':'application/json'}
          def get(url):
            req=urllib.request.Request(url,headers=headers)
            with urllib.request.urlopen(req,timeout=11) as r: return r.read()
          success=False
          for host in HOSTS:
            try:
              data=json.loads(get(host+'/api/v1/videos/'+VID).decode())
              boards=data.get('storyboards',[])
              print('INSTANCE',host,'title',data.get('title','')[:70],'boards',len(boards),flush=True)
              boards=sorted(boards,key=lambda x:(int(x.get('width') or 0)*int(x.get('height') or 0)),reverse=True)
              for board in boards:
                w=int(board.get('width') or 0);h=int(board.get('height') or 0)
                sw=int(board.get('storyboardWidth') or board.get('columns') or 5)
                sh=int(board.get('storyboardHeight') or board.get('rows') or 5)
                interval=int(board.get('interval') or 0)
                tpl=board.get('templateUrl') or board.get('url') or ''
                print('BOARD',w,h,sw,sh,interval,tpl[:160],flush=True)
                if w<70 or h<39 or interval<1000 or not tpl.startswith('https://'):continue
                pics={}
                os.makedirs(BASE,exist_ok=True)
                done=0
                try:
                  for j,second in enumerate(TIMES):
                    idx=(second*1000)//interval
                    tile=(idx//(sw*sh))
                    frame=(idx%(sw*sh))
                    url=tpl.replace('M$M','M'+str(tile)).replace('$M',str(tile)).replace('$N','M'+str(tile)).replace('$L','2')
                    if url not in pics:
                      raw=get(url)
                      img=Image.open(io.BytesIO(raw));img.load()
                      pics[url]=img
                    img=pics[url]
                    xy=(frame%sw*w,frame//sw*h,((frame%sw)+1)*w,((frame//sw)+1)*h)
                    if xy[2]>img.width or xy[3]>img.height:raise RuntimeError('sprite dimensions wrong '+str((img.size,xy)))
                    frame_img=img.crop(xy)
                    frame_img=frame_img.resize((960,540),Image.Resampling.LANCZOS)
                    file=BASE+'/scene-'+str(j+1).zfill(2)+'.jpg'
                    frame_img.save(file,quality=91)
                    done+=1
                  print('SUCCESS_STILLS',done,'SIZE',w,h,flush=True)
                  success=done==24
                  if success:break
                except Exception as ex:print('BOARD_FAILED',repr(ex)[:230],flush=True)
                finally:
                  if not success:
                    for x in os.listdir(BASE):
                      if x.startswith('scene-'):os.unlink(os.path.join(BASE,x))
              if success:break
            except Exception as ex:print('INSTANCE_FAILED',host,repr(ex)[:260],flush=True)
          print('FINAL_SUCCESS',success)
          PY
      - name: Commit verified source frame images
        run: |
          if test -f study/vibe-coding/01-ui-terms/frames/scene-24.jpg; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add study/vibe-coding/01-ui-terms/frames/
            git diff --cached --quiet || (git commit -m "Add authentic YouTube preview video stills for 24 topics" && git push)
          fi
